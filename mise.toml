[tools]
go = "1.27"
bun = "1.4"
node = "24"
prek = "0.5.5"
gitleaks = "8.30.0"
rumdl = "0.1.22"
terraform = "1.13.5"
"aqua:pressly/goose" = "3.29.0"
"npm:vite" = "8.3.5"
"npm:typescript" = "7.0.2"
"npm:@playwright/test" = "1.64.1"
"npm:prettier" = "3.9.10"

[settings]
lockfile = true

[tasks.hooks]
description = "Run commit checks against all tracked files (inside Linux container)"
run = "prek run --all-files"

[tasks.test]
description = "Run Go tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Check backend, frontend, scripts and migrations"
depends = ["backend:lint", "frontend:lint", "scripts:lint", "db:lint"]

[tasks."backend:lint"]
description = "Check Go code with vet and gofmt"
run = '''
set -eu
go vet ./...
go vet -tags=integration ./...
unformatted_go_files=$(gofmt -l cmd internal)
if [ -n "$unformatted_go_files" ]; then
  printf 'Go files need formatting:\n%s\n' "$unformatted_go_files"
  exit 1
fi
'''

[tasks."scripts:lint"]
description = "Check shell syntax, including CI and container setup"
run = "for script in scripts/*.sh .github/scripts/*.sh .devcontainer/*.sh; do bash -n \"$script\" || exit; done"

[tasks."db:lint"]
description = "Validate both migration histories"
run = '''
goose -env none -dir migrations/catalog validate
goose -env none -dir migrations/requests validate
'''

[tasks."frontend:lint"]
description = "Typecheck and format-check the frontend"
run = '''
tsc -p frontend
prettier --check frontend/src frontend/scripts frontend/*.html frontend/tsconfig.json frontend/vite.config.js frontend/e2e frontend/ssg-tests
'''

[tasks.build]
description = "Build independent Go APIs and static frontend"
depends = ["backend:build", "frontend:build"]

[tasks."backend:build"]
description = "Build independent Go APIs"
run = "mkdir -p build && go build -o build/catalog ./cmd/catalog && go build -o build/requests ./cmd/requests"

[tasks."test:integration"]
description = "Test PostgreSQL storage in a new temporary local database, then remove it"
run = "bash scripts/test-db.sh"

[tasks."db:bootstrap"]
description = "Provision local database roles and empty schemas for migrations"
run = "bash scripts/db-bootstrap.sh"

[tasks."db:migrate"]
description = "Apply catalog and requests SQL migrations to local PostgreSQL"
run = "bash scripts/db-migrate.sh"

[tasks."frontend:install"]
description = "Install frontend libraries from the Bun lockfile"
run = "bun install --cwd frontend --frozen-lockfile"

[tasks."db:runtime"]
description = "Provision restricted local LOGIN accounts from Compose secrets"
run = "bash scripts/db-runtime.sh"

[tasks."db:seed"]
description = "Insert synthetic dev products without resetting existing data"
run = "bash scripts/seed-dev.sh"

[tasks.dev]
description = "Run local catalog, requests API and Vite"
run = "bash scripts/dev.sh"

[tasks."admin:user"]
description = "Create/reset a local admin from a private password file; revoke sessions"
run = "bash scripts/admin-user.sh"

[tasks."test:browser"]
description = "Test browser checkout against real APIs and a temporary test DB"
run = "TIRESHOP_BROWSER_TEST=1 bash scripts/test-db.sh"

[tasks."frontend:build"]
description = "Typecheck and build static frontend without Go or database access"
run = "tsc -p frontend && bun frontend/scripts/build.tsx"

[tasks."infra:check"]
description = "Validate Terraform and run mocked plans without cloud credentials"
run = '''
terraform -chdir=deploy/terraform fmt -check -recursive
terraform -chdir=deploy/terraform init -backend=false -input=false -lockfile=readonly
terraform -chdir=deploy/terraform validate
terraform -chdir=deploy/terraform test -no-color
'''

[tasks."test:bootstrap"]
description = "Verify production bootstrap on a disposable local DB without superuser rights"
run = "bash scripts/test-production-bootstrap.sh"

[tasks."test:ssg"]
description = "Verify built HTML, hydration, navigation and HTTP 404 locally"
run = '''
export PLAYWRIGHT_TEST_MODULE="$(mise where npm:@playwright/test)/node_modules/@playwright/test"
playwright test --config frontend/ssg-tests/playwright.config.cjs
'''

[tasks."test:ssg-build"]
description = "Reject incomplete snapshots and verify safe HTML serialization"
run = "node frontend/scripts/check-build.mjs"

[tasks."test:media"]
description = "Verify direct image requests with a configured public media base"
run = '''
set -e
trap 'VITE_MEDIA_BASE_URL= mise run frontend:build' EXIT
export VITE_MEDIA_BASE_URL=https://storage.googleapis.com/tireshop-test
mise run frontend:build
export PLAYWRIGHT_TEST_MODULE="$(mise where npm:@playwright/test)/node_modules/@playwright/test"
playwright test --config frontend/ssg-tests/playwright.config.cjs --grep 'direct media'
'''
