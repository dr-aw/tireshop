services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: development

    working_dir: /workspace

    command: ["sleep", "infinity"]

    init: true
    stdin_open: true
    tty: true

    user: vscode

    volumes:
      - type: bind
        source: .
        target: /workspace

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6

    restart: unless-stopped

    environment:
      POSTGRES_DB: tireshop_dev
      POSTGRES_USER: tireshop
      POSTGRES_PASSWORD: tireshop_dev

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tireshop -d tireshop_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
