services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: development

    working_dir: /workspace

    command: ["sleep", "infinity"]

    init: true
    stdin_open: true
    tty: true

    user: vscode

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: tireshop
      PGDATABASE: tireshop_dev
      PGPASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password
      - catalog_password
      - requests_password

    volumes:
      - type: bind
        source: .
        target: /workspace

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6

    ports:
      - "127.0.0.1:5432:5432"

    restart: unless-stopped

    environment:
      POSTGRES_DB: tireshop_dev
      POSTGRES_USER: tireshop
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tireshop -d tireshop_dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_PATH:-../tireshop-secrets/postgres_password}
  catalog_password:
    file: ${CATALOG_PASSWORD_PATH:-../tireshop-secrets/catalog_password}
  requests_password:
    file: ${REQUESTS_PASSWORD_PATH:-../tireshop-secrets/requests_password}
