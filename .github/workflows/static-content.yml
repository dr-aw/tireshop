name: Static content refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: static-content-publication
  cancel-in-progress: false

jobs:
  refresh:
    # Off until manual SSG rollout and HTTP checks are complete.
    if: vars.SSG_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 25
    env:
      MISE_ENV: ""
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked Node
        run: bash .github/scripts/setup-ci.sh node
      - name: Rebuild the pinned live commit and wait for publication
        env:
          RENDER_STATIC_SERVICE_ID: ${{ vars.RENDER_STATIC_SERVICE_ID }}
          RENDER_CONTENT_COMMIT: ${{ vars.RENDER_CONTENT_COMMIT }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: mise exec -- node scripts/render-content-deploy.mjs
