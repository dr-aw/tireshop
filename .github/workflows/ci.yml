name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: ubuntu:24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tireshop
          POSTGRES_DB: postgres
          # Disposable synthetic CI DB, isolated network, no published host port.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U tireshop -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential unzip xz-utils postgresql-client
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare locked toolchain and disposable DB credentials
        run: bash .github/scripts/setup-ci.sh
      - name: Install frontend dependencies and Chromium
        run: |
          mise run frontend:install
          mise exec -- playwright install --with-deps chromium
      - name: Scan repository history for secrets
        run: mise exec -- gitleaks git --redact --no-banner
      - name: Test, lint and build
        run: |
          mise run test
          mise run lint
          mise exec -- rumdl check .
          mise run build
      - name: PostgreSQL migrations, integration and browser tests
        run: mise run test:browser
      - name: Build portable Linux executables
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 mise exec -- go build -trimpath -o build/catalog ./cmd/catalog
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 mise exec -- go build -trimpath -o build/requests ./cmd/requests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-amd64-${{ github.sha }}
          path: |
            build/catalog
            build/requests
            frontend/dist
          if-no-files-found: error
          retention-days: 7

  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-amd64-${{ github.sha }}
          path: release
      - name: Package verified binaries and publish images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in catalog requests; do
            image="$repository/$service:$GITHUB_SHA"
            docker build --platform linux/amd64 --build-arg SERVICE="$service" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -f deploy/api.Dockerfile -t "$image" release/build
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s: `%s`\n\n' "$service" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
