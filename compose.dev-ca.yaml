services:
  dev:
    volumes:
      - type: bind
        source: ${AIVEN_CA_PATH:-../tireshop-secrets/ca.pem}
        target: /etc/tireshop-ca/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MIGRATION_PASSWORD_PATH:-../tireshop-secrets/migration_password}
        target: /etc/tireshop-passwords/migration_password
        read_only: true
        bind:
          create_host_path: false
